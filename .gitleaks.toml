title = "Custom Gitleaks Configuration"

[extend]
useDefault = true

# --------------------------------------------------
# Custom rules for passwords / credentials
# --------------------------------------------------

[[rules]]
id = "generic-password"
description = "Generic hardcoded password"
regex = '''(?i)(password|passwd|pwd)\s*[:=]\s*["']?[^"'\s]+["']?'''
keywords = ["password", "passwd", "pwd"]

[[rules]]
id = "azure-client-secret"
description = "Azure Service Principal Client Secret"
regex = '''(?i)(client[_-]?secret|azure[_-]?client[_-]?secret)\s*[:=]\s*["']?[A-Za-z0-9._~+/=-]{8,}["']?'''
keywords = ["client_secret", "client-secret", "azure_client_secret"]

[[rules]]
id = "azure-client-id"
description = "Azure Client ID"
regex = '''(?i)(client[_-]?id|azure[_-]?client[_-]?id)\s*[:=]\s*["']?[0-9a-f]{8}-[0-9a-f-]{27,}["']?'''
keywords = ["client_id", "client-id", "azure_client_id"]

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(api[_-]?key|apikey)\s*[:=]\s*["']?[A-Za-z0-9_\-]{16,}["']?'''
keywords = ["api_key", "api-key", "apikey"]

[[rules]]
id = "generic-token"
description = "Generic hardcoded token"
regex = '''(?i)(token|access[_-]?token|auth[_-]?token)\s*[:=]\s*["']?[A-Za-z0-9._~+/=-]{16,}["']?'''
keywords = ["token", "access_token", "auth_token"]

# --------------------------------------------------
# Allowlist - only add files that are genuinely safe
# --------------------------------------------------

[allowlist]
description = "Global allowlist"

paths = [
    '''(^|/)\.git/''',
    '''(^|/)node_modules/''',
    '''(^|/)vendor/''',
    '''(^|/)terraform\.tfstate\.backup$'''
]
